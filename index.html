<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة أركان الدوائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-bg: #e1f5fe; --accent-blue: #0288d1; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--primary-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 380px; background: #ffffff; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; min-height: 600px; position: relative; }
        .hidden { display: none !important; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; text-align: right; }
        
        /* ضبط خانة التاريخ لمنع انعكاس الحروف */
        input[type="date"] {
            direction: ltr !important;
            text-align: right !important;
            font-family: inherit;
        }

        .primary-btn { background: var(--accent-blue); color: white; border: none; font-weight: bold; cursor: pointer; text-align: center; }
        .back-btn { background: #6c757d; color: white; border: none; text-align: center; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .grid-item { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #eee; }
        .card { background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #f9f9f9; padding: 8px; border-radius: 8px; }
        .item-row input { width: 90px; margin-bottom: 0; text-align: center; }
        .filter-box { background: #f0f7ff; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #b3e5fc; text-align: right; }
        .filter-box label { font-size: 13px; font-weight: bold; color: #0277bd; display: block; margin-bottom: 4px; }
        
        .date-container {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0 10px;
            margin-bottom: 10px;
        }
        .date-container input {
            border: none;
            margin-bottom: 0;
            padding: 10px 0;
        }
        .company-header {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        .company-header h2 {
            color: var(--accent-blue);
            font-size: 22px;
            font-weight: bold;
        }
        .company-header p {
            color: #666;
            font-size: 14px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="company-header">
            <i class="fa-solid fa-hospital-user" style="font-size: 40px; color: var(--accent-blue); margin-bottom: 8px;"></i>
            <h2>شركة أركان الدوائية</h2>
            <p>تسجيل الدخول</p>
        </div>
        <input type="text" id="login-name" placeholder="اسم المندوب">
        <input type="password" id="login-pass" placeholder="الرقم السري">
        <button class="primary-btn" onclick="login()">دخول</button>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="hidden">
        <h3 id="welcome-msg" style="text-align:center;"></h3>
        <div class="grid-container">
            <div class="grid-item" onclick="openScreen('clients-list-screen')"><i class="fa-solid fa-users"></i><br>العملاء</div>
            <div class="grid-item" onclick="openScreen('add-client-screen')"><i class="fa-solid fa-user-plus"></i><br>إضافة عميل</div>
            <div class="grid-item" onclick="openScreen('visits-screen')"><i class="fa-solid fa-clipboard-list"></i><br>سجل الزيارات</div>
            <div class="grid-item" onclick="openScreen('inventory-screen')"><i class="fa-solid fa-boxes-stacked"></i><br>جرد جديد</div>
            <div class="grid-item hidden" id="admin-report-btn" onclick="openScreen('report-screen')"><i class="fa-solid fa-chart-line"></i><br>التقارير الشاملة</div>
        </div>
        <button class="back-btn" style="margin-top:20px;" onclick="location.reload()">خروج</button>
    </div>

    <!-- Add Client Screen -->
    <div id="add-client-screen" class="hidden">
        <h3>إضافة عميل جديد</h3>
        <input type="text" id="new-client-name" placeholder="اسم العميل">
        <select id="new-client-type">
            <option value="صيدلية">صيدلية</option>
            <option value="شركة">شركة</option>
            <option value="عيادة">عيادة</option>
        </select>
        <button class="primary-btn" onclick="addClient()">حفظ العميل</button>
        <button class="back-btn" onclick="goHome()">رجوع</button>
    </div>

    <!-- Clients List Screen -->
    <div id="clients-list-screen" class="hidden">
        <h3>قائمة العملاء الخاصة بي</h3>
        <div id="clients-display-list"></div>
        <button class="back-btn" onclick="goHome()">رجوع</button>
    </div>

    <!-- New Inventory Screen -->
    <div id="inventory-screen" class="hidden">
        <h3>تسجيل جرد جديد</h3>
        <label style="font-size:12px; font-weight:bold;">اختر العميل:</label>
        <select id="inv-client-select"></select>

        <label style="font-size:12px; font-weight:bold; margin-top:5px; display:block;">أدخل الكميات المتوفرة:</label>
        <div id="products-qty-list" style="max-height: 280px; overflow-y: auto; margin-bottom: 10px;"></div>

        <button class="primary-btn" onclick="saveInventory()">حفظ الجرد</button>
        <button class="back-btn" onclick="goHome()">رجوع</button>
    </div>
    
    <!-- Visits Log Screen -->
    <div id="visits-screen" class="hidden">
        <h3>سجل زياراتي والجرد</h3>
        <div id="visits-list"></div>
        <button class="back-btn" onclick="goHome()">رجوع</button>
    </div>

    <!-- Admin Reports Screen -->
    <div id="report-screen" class="hidden">
        <h3 style="margin-bottom:10px;">التقارير الشاملة (الأدمن)</h3>
        
        <!-- أدوات التصفية -->
        <div class="filter-box">
            <label><i class="fa-solid fa-filter"></i> تصفية حسب المندوب:</label>
            <select id="filter-rep-select" onchange="filterReports()"></select>

            <label style="margin-top:8px;"><i class="fa-solid fa-calendar-days"></i> تصفية حسب التاريخ:</label>
            <div class="date-container">
                <input type="date" id="filter-date-input" onchange="filterReports()">
            </div>
            
            <button style="padding:8px; font-size:12px; margin-bottom:0; background:#e0e0e0; border:none; border-radius:6px; cursor:pointer;" onclick="clearDateFilter()">عرض الكل بدون تحديد تاريخ</button>
        </div>

        <div id="reports-content" style="max-height: 280px; overflow-y: auto; margin-bottom: 10px;"></div>
        <button class="back-btn" onclick="goHome()">رجوع</button>
    </div>
</div>

<script>
    let clients = JSON.parse(localStorage.getItem('my_clients')) || [];
    let products = ["Irosky", "Pregna sky", "Ido sky", "Men sky", "Women sky", "D sky", "Calci sky"];
    let inventoryLogs = JSON.parse(localStorage.getItem('my_logs')) || [];

    function login() {
        const name = document.getElementById('login-name').value.trim();
        if(name) {
            localStorage.setItem('currentUser', name);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "مرحباً " + name;
            
            if(name === "ايهاب العريبي" || name === "إيهاب العريبي") {
                document.getElementById('admin-report-btn').classList.remove('hidden');
            }
        }
    }

    function addClient() {
        const name = document.getElementById('new-client-name').value;
        const type = document.getElementById('new-client-type').value;
        const rep = localStorage.getItem('currentUser');
        
        if(name) {
            clients.push({name, type, rep});
            localStorage.setItem('my_clients', JSON.stringify(clients));
            alert("تم حفظ العميل بنجاح!");
            document.getElementById('new-client-name').value = '';
            goHome();
        }
    }

    function saveInventory() {
        const client = document.getElementById('inv-client-select').value;
        const rep = localStorage.getItem('currentUser');
        let details = [];

        products.forEach((p, idx) => {
            let qty = document.getElementById(`prod-qty-${idx}`).value || 0;
            if(qty > 0) {
                details.push(`${p}: ${qty}`);
            }
        });

        if(!client) {
            alert("يرجى اختيار عميل أولاً!");
            return;
        }

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const isoDate = `${year}-${month}-${day}`; 
        const timeStr = now.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});

        inventoryLogs.push({
            client, 
            rep, 
            details: details.join(' | ') || "لا يوجد كميات", 
            isoDate: isoDate,
            displayDate: `${year}/${month}/${day} ${timeStr}`
        });

        localStorage.setItem('my_logs', JSON.stringify(inventoryLogs));
        alert("تم حفظ الجرد بنجاح!");
        goHome();
    }

    function openScreen(id) {
        document.querySelectorAll('.phone-container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        
        const currentRep = localStorage.getItem('currentUser');
        const myClients = clients.filter(c => c.rep === currentRep);

        if(id === 'inventory-screen') {
            document.getElementById('inv-client-select').innerHTML = myClients.length ? 
                myClients.map(c => `<option value="${c.name}">${c.name} (${c.type})</option>`).join('') :
                '<option value="">لا يوجد عملاء مضافين لك</option>';

            document.getElementById('products-qty-list').innerHTML = products.map((p, idx) => `
                <div class="item-row">
                    <span style="font-weight:bold; font-size:14px; dir:ltr; display:inline-block;">${p}</span>
                    <input type="number" id="prod-qty-${idx}" placeholder="0" min="0">
                </div>
            `).join('');
        }

        if(id === 'clients-list-screen') {
            document.getElementById('clients-display-list').innerHTML = myClients.length ? 
                myClients.map(c => `<div class="card"><span>${c.name}</span><small style="color:var(--accent-blue)">(${c.type})</small></div>`).join('') :
                '<p style="text-align:center; color:gray; margin-top:20px;">لا يوجد عملاء مسجلين باسمك</p>';
        }

        if(id === 'visits-screen') {
            const myLogs = inventoryLogs.filter(l => l.rep === currentRep);
            document.getElementById('visits-list').innerHTML = myLogs.length ? 
                myLogs.map(l => `
                    <div class="card" style="flex-direction:column; align-items:flex-start;">
                        <div style="display:flex; justify-content:space-between; width:100%;">
                            <strong>${l.client}</strong>
                            <small style="color:gray; direction:ltr; display:inline-block;">${l.displayDate || l.date}</small>
                        </div>
                        <div style="margin-top:5px; font-size:13px; color:#333; direction:ltr; text-align:right;">${l.details}</div>
                    </div>
                `).join('') :
                '<p style="text-align:center; color:gray; margin-top:20px;">لا يوجد سجل زيارات سابق لك</p>';
        }

        if(id === 'report-screen') {
            const repsList = [...new Set(inventoryLogs.map(l => l.rep))];
            let repOptions = '<option value="ALL">جميع المندوبين</option>';
            repsList.forEach(r => { repOptions += `<option value="${r}">${r}</option>`; });
            document.getElementById('filter-rep-select').innerHTML = repOptions;

            filterReports();
        }
    }

    function filterReports() {
        const selectedRep = document.getElementById('filter-rep-select').value;
        const selectedDate = document.getElementById('filter-date-input').value;

        let filtered = inventoryLogs;

        if (selectedRep !== 'ALL') {
            filtered = filtered.filter(l => l.rep === selectedRep);
        }

        if (selectedDate) {
            filtered = filtered.filter(l => l.isoDate === selectedDate || (l.date && l.date.includes(selectedDate)));
        }

        const reportsContainer = document.getElementById('reports-content');
        if (filtered.length) {
            reportsContainer.innerHTML = filtered.map(l => `
                <div class="card" style="flex-direction:column; align-items:flex-start;">
                    <div style="display:flex; justify-content:space-between; width:100%;">
                        <strong>${l.client}</strong>
                        <small style="color:gray; direction:ltr; display:inline-block;">${l.displayDate || l.date}</small>
                    </div>
                    <small style="color:var(--accent-blue); font-weight:bold;">المندوب: ${l.rep}</small>
                    <div style="margin-top:5px; font-size:13px; color:#333; direction:ltr; text-align:right;">${l.details}</div>
                </div>
            `).join('');
        } else {
            reportsContainer.innerHTML = '<p style="text-align:center; color:gray; margin-top:20px;">لا توجد تقارير مطابقة للفلاتر المحددة</p>';
        }
    }

    function clearDateFilter() {
        document.getElementById('filter-date-input').value = '';
        filterReports();
    }

    function goHome() {
        document.querySelectorAll('.phone-container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('home-screen').classList.remove('hidden');
    }
</script>
</body>
</html>

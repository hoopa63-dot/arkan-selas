<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة أركان الدوائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-bg: #e1f5fe; --accent-blue: #0288d1; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--primary-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 380px; background: #ffffff; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; min-height: 600px; position: relative; }
        .hidden { display: none !important; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; text-align: right; }
        input[type="date"] { direction: ltr !important; text-align: right !important; }
        .primary-btn { background: var(--accent-blue); color: white; border: none; font-weight: bold; cursor: pointer; text-align: center; }
        .back-btn { background: #6c757d; color: white; border: none; text-align: center; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .grid-item { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #eee; }
        .card { background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #f9f9f9; padding: 8px; border-radius: 8px; }
        .item-row input { width: 90px; margin-bottom: 0; text-align: center; }
        .company-header { text-align: center; margin-top: 15px; margin-bottom: 25px; }
        .company-header h2 { color: var(--accent-blue); font-size: 22px; font-weight: bold; }
        .error-msg { color: red; font-size: 12px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="company-header">
            <i class="fa-solid fa-hospital-user" style="font-size: 40px; color: var(--accent-blue); margin-bottom: 8px;"></i>
            <h2>شركة أركان الدوائية</h2>
            <p>تسجيل الدخول</p>
        </div>
        <input type="text" id="login-name" placeholder="اسم المندوب">
        <input type="password" id="login-pass" placeholder="كلمة السر">
        <div id="login-error" class="error-msg hidden">اسم المستخدم أو كلمة السر غير صحيحة!</div>
        <button class="primary-btn" onclick="login()">دخول</button>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="hidden">
        <h3 id="welcome-msg" style="text-align:center; margin-bottom: 20px;"></h3>
        <div class="grid-container">
            <div class="grid-item" onclick="openScreen('clients-list-screen')"><i class="fa-solid fa-users"></i><br>العملاء</div>
            <div class="grid-item" onclick="openScreen('add-client-screen')"><i class="fa-solid fa-user-plus"></i><br>إضافة عميل</div>
            <div class="grid-item" onclick="openScreen('visits-screen')"><i class="fa-solid fa-clipboard-list"></i><br>سجل الزيارات</div>
            <div class="grid-item" onclick="openScreen('inventory-screen')"><i class="fa-solid fa-boxes-stacked"></i><br>جرد جديد</div>
        </div>
        <button class="back-btn" style="margin-top:30px;" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- Add Client Screen -->
    <div id="add-client-screen" class="hidden">
        <h3>إضافة عميل جديد</h3>
        <input type="text" id="new-client-name" placeholder="اسم العميل">
        <select id="new-client-type">
            <option value="صيدلية">صيدلية</option>
            <option value="شركة">شركة</option>
            <option value="عيادة">عيادة</option>
        </select>
        <button class="primary-btn" onclick="addClient()">حفظ العميل</button>
        <button class="back-btn" onclick="goHome()">رجوع</button>
    </div>

    <!-- Clients List Screen -->
    <div id="clients-list-screen" class="hidden">
        <h3>إدارة العملاء</h3>
        <div id="clients-display-list" style="max-height: 350px; overflow-y: auto;"></div>
        <button class="back-btn" style="margin-top:10px;" onclick="goHome()">رجوع</button>
    </div>

    <!-- Inventory Screen -->
    <div id="inventory-screen" class="hidden">
        <h3>تسجيل جرد جديد</h3>
        <label style="font-size:12px; font-weight:bold;">اختر العميل:</label>
        <select id="inv-client-select"></select>

        <label style="font-size:12px; font-weight:bold; margin-top:5px; display:block;">أدخل الكميات:</label>
        <div id="products-qty-list" style="max-height: 280px; overflow-y: auto; margin-bottom: 10px;"></div>

        <button class="primary-btn" onclick="saveInventory()">حفظ الجرد</button>
        <button class="back-btn" onclick="goHome()">رجوع</button>
    </div>

    <!-- Visits Log Screen -->
    <div id="visits-screen" class="hidden">
        <h3>سجل الزيارات والجرد</h3>
        <div id="visits-list"></div>
        <button class="back-btn" style="margin-top:10px;" onclick="goHome()">رجوع</button>
    </div>
</div>

<script>
    // الحسابات المسموح لها بالدخول
    const usersDatabase = [
        { name: "إيهاب العريبي", pass: "123456", role: "admin" },
        { name: "ايهاب العريبي", pass: "123456", role: "admin" },
        { name: "محمد", pass: "1234", role: "rep" },
        { name: "أحمد", pass: "1234", role: "rep" }
    ];

    let products = ["Irosky", "Pregna sky", "Ido sky", "Men sky", "Women sky", "D sky", "Calci sky"];

    function getClients() {
        return JSON.parse(localStorage.getItem('arkan_clients')) || [];
    }

    function saveClientsData(clients) {
        localStorage.setItem('arkan_clients', JSON.stringify(clients));
    }

    function getLogs() {
        return JSON.parse(localStorage.getItem('arkan_logs')) || [];
    }

    function saveLogsData(logs) {
        localStorage.setItem('arkan_logs', JSON.stringify(logs));
    }

    function isAdmin() {
        const name = localStorage.getItem('currentUser') || '';
        const user = usersDatabase.find(u => u.name === name);
        return user && user.role === "admin";
    }

    function login() {
        const nameInput = document.getElementById('login-name').value.trim();
        const passInput = document.getElementById('login-pass').value.trim();
        const errorDiv = document.getElementById('login-error');

        const foundUser = usersDatabase.find(u => u.name === nameInput && u.pass === passInput);

        if (foundUser) {
            errorDiv.classList.add('hidden');
            localStorage.setItem('currentUser', foundUser.name);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "مرحباً " + foundUser.name;
        } else {
            errorDiv.classList.remove('hidden');
        }
    }

    function logout() {
        localStorage.removeItem('currentUser');
        location.reload();
    }

    function addClient() {
        const name = document.getElementById('new-client-name').value.trim();
        const type = document.getElementById('new-client-type').value;
        const rep = localStorage.getItem('currentUser') || "عام";
        
        if(!name) return alert("يرجى إدخال اسم العميل");

        let clients = getClients();
        clients.push({ name, type, rep });
        saveClientsData(clients);

        alert("تم حفظ العميل بنجاح!");
        document.getElementById('new-client-name').value = '';
        goHome();
    }

    function saveInventory() {
        const client = document.getElementById('inv-client-select').value;
        const rep = localStorage.getItem('currentUser') || "عام";
        let details = [];

        products.forEach((p, idx) => {
            let qty = document.getElementById(`prod-qty-${idx}`).value || 0;
            if(qty > 0) details.push(`${p}: ${qty}`);
        });

        if(!client) return alert("يرجى اختيار عميل!");

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const timeStr = now.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});

        let logs = getLogs();
        logs.push({
            client, rep, 
            details: details.join(' | ') || "لا يوجد كميات", 
            displayDate: `${year}/${month}/${day} ${timeStr}`
        });
        saveLogsData(logs);

        alert("تم حفظ الجرد بنجاح!");
        goHome();
    }

    function openScreen(id) {
        document.querySelectorAll('.phone-container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        const currentRep = localStorage.getItem('currentUser') || "عام";
        const clients = getClients();
        const logs = getLogs();

        if(id === 'inventory-screen') {
            let availableClients = clients.filter(c => c.rep === currentRep || c.rep === "عام" || isAdmin());
            document.getElementById('inv-client-select').innerHTML = availableClients.length ? 
                availableClients.map(c => `<option value="${c.name}">${c.name} (${c.type})</option>`).join('') :
                '<option value="">لا يوجد عملاء مضافين</option>';

            document.getElementById('products-qty-list').innerHTML = products.map((p, idx) => `
                <div class="item-row">
                    <span style="font-weight:bold; font-size:14px; dir:ltr;">${p}</span>
                    <input type="number" id="prod-qty-${idx}" placeholder="0" min="0">
                </div>
            `).join('');
        }

        if(id === 'clients-list-screen') {
            let displayList = isAdmin() ? clients : clients.filter(c => c.rep === currentRep || c.rep === "عام");
            document.getElementById('clients-display-list').innerHTML = displayList.length ?
                displayList.map(c => `
                    <div class="card">
                        <div>
                            <strong>${c.name}</strong> <small style="color:var(--accent-blue)">(${c.type})</small>
                            <br><small style="color:gray;">المندوب: ${c.rep}</small>
                        </div>
                    </div>
                `).join('') : '<p style="text-align:center; color:gray; margin-top:20px;">لا يوجد عملاء</p>';
        }

        if(id === 'visits-screen') {
            let displayLogs = isAdmin() ? logs : logs.filter(l => l.rep === currentRep);
            document.getElementById('visits-list').innerHTML = displayLogs.length ? 
                displayLogs.map(l => `
                    <div class="card" style="flex-direction:column; align-items:flex-start;">
                        <div style="display:flex; justify-content:space-between; width:100%;">
                            <strong>${l.client}</strong>
                            <small style="color:gray;">${l.displayDate}</small>
                        </div>
                        <small style="color:var(--accent-blue);">المندوب: ${l.rep}</small>
                        <div style="margin-top:5px; font-size:13px; text-align:right;">${l.details}</div>
                    </div>
                `).join('') : '<p style="text-align:center; color:gray; margin-top:20px;">لا يوجد سجلات</p>';
        }
    }

    function goHome() {
        document.querySelectorAll('.phone-container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('home-screen').classList.remove('hidden');
    }
</script>
</body>
</html>
